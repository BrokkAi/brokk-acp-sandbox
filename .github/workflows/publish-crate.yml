name: Publish to crates.io

# Publishes `brokk-acp-sandbox` to crates.io on every `v*` tag, using
# crates.io's Trusted Publishers (OIDC) — no long-lived
# `CARGO_REGISTRY_TOKEN` secret in this repo.
#
# Required one-time setup (off-repo):
#   1. https://crates.io/crates/brokk-acp-sandbox/settings
#      Trusted Publishers → Add:
#        repository     = BrokkAi/brokk-acp-sandbox
#        workflow file  = publish-crate.yml
#        environment    = release
#   2. https://github.com/BrokkAi/brokk-acp-sandbox/settings/environments
#      Create an environment named `release`. Recommended: add a
#      required reviewer so a human approves each publish.
#
# Don't forget to rebuild and commit `wasm/brokk-acp-sandbox.wasm`
# before tagging — see README.md. The drift-check job in `ci.yml`
# will fail the PR if the committed `.wasm` doesn't match a fresh
# `wasm32-wasip2` build.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches Cargo.toml version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED_VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$EXPECTED_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag version ($EXPECTED_VERSION) does not match Cargo.toml version ($CARGO_VERSION). Bump Cargo.toml before tagging."
            exit 1
          fi
          echo "Tag and Cargo.toml versions match: $CARGO_VERSION"

      - name: Authenticate with crates.io via OIDC
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

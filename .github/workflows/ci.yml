name: CI

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Needed for the wasm-builds-from-source check below: the
          # crate ships a pre-built `wasm/brokk-acp-sandbox.wasm` as
          # its published artifact, so a change that compiles natively
          # but breaks `wasm32-wasip2` must fail PR review.
          targets: wasm32-wasip2

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      # The published artifact is `wasm/brokk-acp-sandbox.wasm`, which
      # is committed and shipped via `pub const WASM_BYTES`. Verify the
      # source still builds for `wasm32-wasip2` and that both the fresh
      # build and committed artifact expose the workspace command entry
      # point. Raw release wasm bytes are not reproducible across all
      # runners/toolchain environments, so CI avoids byte-for-byte cmp.
      - name: Verify sandbox wasm artifact
        run: |
          cargo build --release --bin brokk-acp-sandbox --target wasm32-wasip2
          test -s wasm/brokk-acp-sandbox.wasm
          test -s target/wasm32-wasip2/release/brokk-acp-sandbox.wasm
          grep -a -q 'runWorkspaceCommand' wasm/brokk-acp-sandbox.wasm
          grep -a -q 'runWorkspaceCommand' target/wasm32-wasip2/release/brokk-acp-sandbox.wasm

name: CI

on:
  push:
    branches: [ 'master' ]
  pull_request:
    branches: [ 'master' ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          # Needed for the wasm-builds-from-source check below: the
          # crate ships a pre-built `wasm/brokk-acp-sandbox.wasm` as
          # its published artifact, so a change that compiles natively
          # but breaks `wasm32-wasip2` must fail PR review.
          targets: wasm32-wasip2

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy lints
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      # The published artifact is `wasm/brokk-acp-sandbox.wasm`, which
      # is committed and shipped via `pub const WASM_BYTES`. A source
      # change that forgets to refresh the committed artifact would make
      # native and sandboxed behavior drift, so compare the fresh build
      # against the checked-in bytes.
      - name: Verify committed wasm artifact
        run: |
          cargo build --release --bin brokk-acp-sandbox --target wasm32-wasip2
          cmp target/wasm32-wasip2/release/brokk-acp-sandbox.wasm wasm/brokk-acp-sandbox.wasm
